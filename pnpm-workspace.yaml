packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  '@google/genai': true
  '@swc/core': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
  phase: true
  protobufjs: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.10.14-canary.1'
  - '@turbo/darwin-arm64@2.10.14-canary.1'
  - '@turbo/linux-64@2.10.14-canary.1'
  - '@turbo/linux-arm64@2.10.14-canary.1'
  - '@turbo/windows-64@2.10.14-canary.1'
  - '@turbo/windows-arm64@2.10.13 || 2.10.14-canary.1'

preferWorkspacePackages: true
